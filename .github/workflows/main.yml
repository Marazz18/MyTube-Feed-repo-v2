name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project and copy extension files into assets
        run: |
          if [ ! -f android/app/build.gradle ]; then
            echo "::error::android/ folder is missing in the repo"; exit 1
          fi
          A=android/app/src/main/assets
          mkdir -p "$A"
          for f in feed.html feed.js feed.css shared.js sync.js nostr.bundle.js addlink.js; do
            if [ ! -f "$f" ]; then echo "::error::Missing file in repo root: $f"; exit 1; fi
            cp "$f" "$A/$f"
          done
          ls -la "$A"

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(jq -r .version manifest.json)"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Signing key (optional)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android assembleRelease -PversionName="${{ steps.ver.outputs.name }}" -PversionCode="${{ github.run_number }}"

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk MyTubeFeed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyTubeFeed-apk
          path: MyTubeFeed.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" MyTubeFeed.apk --clobber
