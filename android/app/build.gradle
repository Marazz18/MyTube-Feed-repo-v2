plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.mytube.feed'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.mytube.feed'
        minSdk 29
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        versionName((project.findProperty('versionName') ?: '0.0.0').toString())
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // bez vlastního klíče se podepíše debug klíčem (aktualizace přes starší verzi pak nepůjdou)
            signingConfig(System.getenv('KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
